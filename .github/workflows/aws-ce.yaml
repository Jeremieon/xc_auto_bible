name: AWS&F5XC(CE-Only)

on:
  workflow_dispatch:
jobs:
  ce-instance-deployment:
    runs-on: ubuntu-latest
    outputs:
      aws_site_name: ${{ steps.get-outputs.outputs.aws_site_name }}
      private_app_ip: ${{ steps.get-outputs.outputs.private_ip }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}
          terraform_wrapper: false

      - name: Terraform Init
        run: |
          cd customer-edge-lb/f5ce-aws
          terraform init
      - name: Setup F5XC Credentials
        run: |
          cd customer-edge-lb/f5ce-aws
          echo "${{ secrets.P12_CERTIFICATE_BASE64 }}" | base64 -d > api-creds.p12
          chmod 600 api-creds.p12

      - name: Terraform Plan
        env:
          TF_VAR_f5xc_api_p12: "./api-creds.p12"
          VES_P12_PASSWORD: "AstraH07+"

        run: |
          cd customer-edge-lb/f5ce-aws
          export VES_P12_PASSWORD="AstraH07+"
          terraform plan

      - name: Terraform Apply
        env:
          VES_P12_PASSWORD: ${{ secrets.VES_P12_PASSWORD }}
          TF_VAR_f5xc_api_p12: "./api-creds.p12"
        run: |
          cd customer-edge-lb/f5ce-aws
          terraform apply -auto-approve

      - name: Get Outputs from Terraform Cloud
        id: get-outputs
        run: |
          cd customer-edge-lb/f5ce-aws

          # Wait a moment for outputs to be available
          sleep 5

          # Get outputs
          SITE_NAME=$(terraform output -raw aws_site_name)
          PRIVATE_IP=$(terraform output -raw private_app_ip)

          echo "Public IP: $SITE_NAME"
          echo "Private IP: $PRIVATE_IP"

          echo "aws_site_name=$SITE_NAME" >> $GITHUB_OUTPUT
          echo "private_ip=$PRIVATE_IP" >> $GITHUB_OUTPUT

  f5xc-automation:
    runs-on: ubuntu-latest
    needs: ce-instance-deployment

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Debug - Check IP values
        run: |
          echo "Received SITE_NAME: ${{ needs.aws-instance-deployment.outputs.aws_site_name }}"
          echo "Received Private IP: ${{ needs.aws-instance-deployment.outputs.private_app_ip }}"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}
          terraform_wrapper: false

      - name: Deploy F5XC HTTP only Load Balancer
        env:
          VES_P12_PASSWORD: ${{ secrets.VES_P12_PASSWORD }}
          TF_VAR_f5xc_api_p12: "./api-creds.p12"
          TF_VAR_inside_network_IP: ${{ needs.ce-instance-deployment.outputs.private_app_ip }}
          TF_VAR_site_name: ${{ needs.ce-instance-deployment.outputs.aws_site_name }}
        run: |
          cd customer-edge-lb/f5xc-ce-https
          echo "Running F5XC terraform Automation"
          echo "Using Public IP: $TF_VAR_public_ip"
          terraform init
          terraform apply -auto-approve
