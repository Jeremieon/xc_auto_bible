name: F5XC(Site Mesh)

on:
  workflow_dispatch:

jobs:
  aws-instance-deployment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}
          terraform_wrapper: false

      - name: Terraform Init
        run: |
          cd site_mesh_grp/ce-instance-aws
          terraform init

      - name: Terraform Plan
        run: |
          cd site_mesh_grp/ce-instance-aws
          terraform plan

      - name: Terraform Apply
        run: |
          cd site_mesh_grp/ce-instance-aws
          terraform apply -auto-approve

  azure-instance-deployment:
    runs-on: ubuntu-latest
    needs: aws-instance-deployment
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}
          terraform_wrapper: false

      - name: Terraform Init
        run: |
          cd site_mesh_grp/ce-instance-azure
          terraform init

      - name: Terraform Plan
        run: |
          cd site_mesh_grp/ce-instance-azure
          terraform plan

      - name: Terraform Apply
        run: |
          cd site_mesh_grp/ce-instance-azure
          terraform apply -auto-approve

  f5xc-aws-site:
    runs-on: ubuntu-latest
    needs: [aws-instance-deployment, azure-instance-deployment]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}
          terraform_wrapper: false

      - name: Deploy F5XC AWS Site
        env:
          VES_P12_CONTENT: ${{ secrets.P12_CERTIFICATE_BASE64 }}
          VES_P12_PASSWORD: ${{ secrets.VES_P12_PASSWORD }}
        run: |
          cd site_mesh_grp/f5xc-aws-site
          terraform init
          terraform apply -auto-approve

  f5xc-azure-site:
    runs-on: ubuntu-latest
    needs: [aws-instance-deployment, azure-instance-deployment]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}
          terraform_wrapper: false

      - name: Deploy F5XC Azure Site
        env:
          VES_P12_CONTENT: ${{ secrets.P12_CERTIFICATE_BASE64 }}
          VES_P12_PASSWORD: ${{ secrets.VES_P12_PASSWORD }}
        run: |
          cd site_mesh_grp/f5xc-azure-site
          terraform init
          terraform apply -auto-approve
