name: F5XC(Site Mesh)

on:
  workflow_dispatch:

jobs:
  aws-ce-deployment:
    runs-on: ubuntu-latest
    outputs:
      aws_site_name: ${{ steps.get-outputs.outputs.aws_site_name }}
      private_app_ip: ${{ steps.get-outputs.outputs.private_ip }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}
          terraform_wrapper: false

      - name: Terraform Init
        run: |
          cd site_mesh/f5xc-ce-aws
          terraform init

      - name: Terraform Plan
        env:
          VES_P12_CONTENT: ${{ secrets.P12_CERTIFICATE_BASE64 }}
          VES_P12_PASSWORD: ${{ secrets.VES_P12_PASSWORD }}
        run: |
          cd site_mesh/f5xc-ce-aws
          terraform plan

      - name: Deploy F5XC AWS Site
        env:
          VES_P12_CONTENT: ${{ secrets.P12_CERTIFICATE_BASE64 }}
          VES_P12_PASSWORD: ${{ secrets.VES_P12_PASSWORD }}
        run: |
          cd site_mesh/f5xc-ce-aws
          terraform apply -auto-approve

      - name: Get AWS Outputs from Terraform Cloud
        id: get-outputs
        run: |
          cd site_mesh/f5xc-ce-aws

          # Wait a moment for outputs to be available
          sleep 5

          # Get outputs
          SITE_NAME=$(terraform output -raw aws_site_name)
          PRIVATE_IP=$(terraform output -raw private_app_ip)

          echo "Site Name IP: $SITE_NAME"
          echo "Private IP: $PRIVATE_IP"

          echo "aws_site_name=$SITE_NAME" >> $GITHUB_OUTPUT
          echo "private_ip=$PRIVATE_IP" >> $GITHUB_OUTPUT

  azure-ce-deployment:
    runs-on: ubuntu-latest
    needs: aws-ce-deployment
    outputs:
      azure_site_name: ${{ steps.get-outputs.outputs.azure_site_name }}
      backend_private_ip: ${{ steps.get-outputs.outputs.backend_private_ip }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}
          terraform_wrapper: false

      - name: Terraform Init
        run: |
          cd site_mesh/f5xc-ce-azure
          terraform init

      - name: Terraform Plan
        env:
          VES_P12_CONTENT: ${{ secrets.P12_CERTIFICATE_BASE64 }}
          VES_P12_PASSWORD: ${{ secrets.VES_P12_PASSWORD }}
        run: |
          cd site_mesh/f5xc-ce-azure
          terraform plan

      - name: Deploy F5XC AZURE Site
        env:
          VES_P12_CONTENT: ${{ secrets.P12_CERTIFICATE_BASE64 }}
          VES_P12_PASSWORD: ${{ secrets.VES_P12_PASSWORD }}
        run: |
          cd site_mesh/f5xc-ce-azure
          terraform apply -auto-approve

      - name: Get Azure Outputs from Terraform Cloud
        id: get-outputs
        run: |
          cd site_mesh/f5xc-ce-azure

          # Wait a moment for outputs to be available
          sleep 5

          # Get outputs
          SITE_NAME=$(terraform output -raw azure_site_name)
          PRIVATE_IP=$(terraform output -raw backend_private_ip)

          echo "Site Name: $SITE_NAME"
          echo "Private IP: $PRIVATE_IP"

          echo "azure_site_name=$SITE_NAME" >> $GITHUB_OUTPUT
          echo "backend_private_ip=$PRIVATE_IP" >> $GITHUB_OUTPUT

  f5xc-backend:
    runs-on: ubuntu-latest
    needs: [aws-ce-deployment, azure-ce-deployment]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Debug - Check IP values
        run: |
          echo "Received SITE_NAME: ${{ needs.azure-ce-deployment.outputs.azure_site_name }}"
          echo "Received Private IP: ${{ needs.azure-ce-deployment.outputs.backend_private_ip }}"
          echo "Received SITE_NAME_AWS: ${{ needs.aws-ce-deployment.outputs.aws_site_name }}"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}
          terraform_wrapper: false

      - name: Deploy F5XC HTTP only Load Balancer

        env:
          VES_P12_CONTENT: ${{ secrets.P12_CERTIFICATE_BASE64 }}
          VES_P12_PASSWORD: ${{ secrets.VES_P12_PASSWORD }}
          TF_VAR_inside_network_IP: ${{ needs.azure-ce-deployment.outputs.backend_private_ip }}
          TF_VAR_site_name: ${{ needs.azure-ce-deployment.outputs.azure_site_name }}
          TF_VAR_site_adv_name: ${{ needs.aws-ce-deployment.outputs.aws_site_name }}
        run: |
          cd site_mesh/f5xc-ce-azure
          echo "Running F5XC terraform Automation"
          echo "Using Public IP: $TF_VAR_public_ip"
          terraform init
          terraform apply -auto-approve

  f5xc-frontend:
    runs-on: ubuntu-latest
    needs: [aws-ce-deployment, azure-ce-deployment, f5xc-backend]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Debug - Check IP values
        run: |
          echo "Received SITE_NAME: ${{ needs.aws-ce-deployment.outputs.aws_site_name }}"
          echo "Received Private IP: ${{ needs.aws-ce-deployment.outputs.private_app_ip }}"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}
          terraform_wrapper: false

      - name: Deploy F5XC HTTP only Load Balancer
        env:
          VES_P12_CONTENT: ${{ secrets.P12_CERTIFICATE_BASE64 }}
          VES_P12_PASSWORD: ${{ secrets.VES_P12_PASSWORD }}
          TF_VAR_inside_network_IP: ${{ needs.aws-ce-deployment.outputs.private_app_ip }}
          TF_VAR_site_name: ${{ needs.aws-ce-deployment.outputs.aws_site_name }}
        run: |
          cd site_mesh/f5xc-ce-aws
          echo "Running F5XC terraform Automation"
          terraform init
          terraform apply -auto-approve
