name: F5XC(Site Mesh)

on:
  workflow_dispatch:

jobs:
  aws-ce-deployment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}
          terraform_wrapper: false

      - name: Terraform Init
        run: |
          cd site_mesh/f5xc-ce-aws
          terraform init

      - name: Terraform Plan
        env:
          VES_P12_CONTENT: ${{ secrets.P12_CERTIFICATE_BASE64 }}
          VES_P12_PASSWORD: ${{ secrets.VES_P12_PASSWORD }}
        run: |
          cd site_mesh/f5xc-ce-aws
          terraform plan

      # - name: Deploy F5XC AWS Site
      #   env:
      #     VES_P12_CONTENT: ${{ secrets.P12_CERTIFICATE_BASE64 }}
      #     VES_P12_PASSWORD: ${{ secrets.VES_P12_PASSWORD }}
      #   run: |
      #     cd site_mesh/f5xc-ce-aws
      #     terraform apply -auto-approve

  azure-ce-deployment:
    runs-on: ubuntu-latest
    needs: aws-ce-deployment
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}
          terraform_wrapper: false

      - name: Terraform Init
        run: |
          cd site_mesh/f5xc-ce-azure
          terraform init

      - name: Terraform Plan
        env:
          VES_P12_CONTENT: ${{ secrets.P12_CERTIFICATE_BASE64 }}
          VES_P12_PASSWORD: ${{ secrets.VES_P12_PASSWORD }}
        run: |
          cd site_mesh/f5xc-ce-azure
          terraform plan

      - name: Deploy F5XC AZURE Site
        env:
          VES_P12_CONTENT: ${{ secrets.P12_CERTIFICATE_BASE64 }}
          VES_P12_PASSWORD: ${{ secrets.VES_P12_PASSWORD }}
        run: |
          cd site_mesh/f5xc-ce-azure
          terraform apply -auto-approve
