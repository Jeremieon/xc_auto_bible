name: F5XC (Site Mesh) - Destroy

on:
  workflow_dispatch:
    inputs:
      confirm_destroy:
        description: 'Type "DESTROY" to confirm deletion of all resources'
        required: true
        type: string

jobs:
  validate-destroy:
    runs-on: ubuntu-latest
    steps:
      - name: Validate Confirmation
        run: |
          if [ "${{ github.event.inputs.confirm_destroy }}" != "DESTROY" ]; then
            echo "Destroy cancelled. You must type 'DESTROY' to confirm."
            exit 1
          fi
          echo "Destroy confirmed. Proceeding with resource deletion..."

  azure-ce-site-destroy:
    runs-on: ubuntu-latest
    needs: validate-destroy
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}
          terraform_wrapper: false

      - name: Destroy F5XC Azure Site
        env:
          VES_P12_CONTENT: ${{ secrets.P12_CERTIFICATE_BASE64 }}
          VES_P12_PASSWORD: ${{ secrets.VES_P12_PASSWORD }}
        run: |
          cd site_mesh/f5xc-ce-azure
          echo "Destroying F5XC Azure Site..."
          terraform init
          terraform destroy -auto-approve
          echo "F5XC Azure Site destroyed"

  aws-ce-site-destroy:
    runs-on: ubuntu-latest
    needs: azure-ce-site-destroy
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}
          terraform_wrapper: false

      - name: Destroy F5XC AWS Site
        env:
          VES_P12_CONTENT: ${{ secrets.P12_CERTIFICATE_BASE64 }}
          VES_P12_PASSWORD: ${{ secrets.VES_P12_PASSWORD }}
        run: |
          cd site_mesh/f5xc-ce-azure
          echo "Destroying F5XC AWS Site..."
          terraform init
          terraform destroy -auto-approve
          echo "F5XC AWS Site destroyed"

  cleanup-complete:
    runs-on: ubuntu-latest
    needs: [azure-ce-site-destroy, aws-ce-site-destroy]
    steps:
      - name: Destruction Summary
        run: |
          echo "✅ Full stack destruction complete!"
          echo "✅ F5XC Azure Site - Destroyed"
          echo "✅ F5XC AWS Site - Destroyed"
          echo "✅ Azure Infrastructure - Destroyed"
          echo "✅ AWS Infrastructure - Destroyed"
