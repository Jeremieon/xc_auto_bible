name: Security

on:
  workflow_dispatch:
jobs:
  azure-public-app:
    runs-on: ubuntu-latest
    outputs:
      public_ip: ${{ steps.get-outputs.outputs.public_ip }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}
          terraform_wrapper: false

      - name: Terraform Init
        run: |
          cd Security/azure_instance
          terraform init
      - name: Terraform Plan
        run: |
          cd Security/azure_instance
          terraform plan

      - name: Terraform Apply
        run: |
          cd Security/azure_instance
          terraform apply -auto-approve

      - name: Get Outputs from Terraform Cloud
        id: get-outputs
        run: |
          cd Security/azure_instance

          # Wait a moment for outputs to be available
          sleep 5

          # Get outputs
          PUBLIC_IP=$(terraform output -raw public_ip)


          echo "Public IP: $PUBLIC_IP"

          echo "public_ip=$PUBLIC_IP" >> $GITHUB_OUTPUT

  f5xc-backend:
    runs-on: ubuntu-latest
    needs: [azure-public-app]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Debug - Check IP values
        run: |
          echo "Received Public IP: ${{ needs.azure-public-app.outputs.public_ip }}"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}
          terraform_wrapper: false

      - name: Deploy F5XC HTTP only Load Balancer

        env:
          VES_P12_CONTENT: ${{ secrets.P12_CERTIFICATE_BASE64 }}
          VES_P12_PASSWORD: ${{ secrets.VES_P12_PASSWORD }}
          TF_VAR_public_ip: ${{ needs.azure-public-app.outputs.public_ip }}

        run: |
          cd Security/secure-app
          echo "Running F5XC terraform Automation"
          echo "Using Public IP: $TF_VAR_public_ip"
          terraform init
          terraform apply -auto-approve
